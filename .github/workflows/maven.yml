name: Maven tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        working-directory: backend
        run: ./mvnw --batch-mode clean verify
